<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17112d">
  <meta name="description" content="Обратный отсчёт до выхода Grand Theft Auto VI в атмосфере Vice City.">
  <title>GTA VI — Vice City Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <img class="city-art" src="city.svg" alt="">
  </div>

  <canvas id="fireworks" aria-hidden="true"></canvas>

  <main>
    <div class="eyebrow">The countdown to the next chapter</div>
    <h1>Grand Theft<br>Auto VI</h1>
    <div class="subtitle">Vice City is calling</div>

    <section class="panel" aria-label="Обратный отсчёт до выхода GTA VI">
      <div class="panel-label" id="panelLabel">До выхода осталось</div>

      <div class="countdown" id="countdown" aria-live="off">
        <div class="unit">
          <div class="num" id="days">00</div>
          <span>Дней</span>
        </div>
        <div class="unit">
          <div class="num" id="hours">00</div>
          <span>Часов</span>
        </div>
        <div class="unit">
          <div class="num" id="minutes">00</div>
          <span>Минут</span>
        </div>
        <div class="unit">
          <div class="num" id="seconds">00</div>
          <span>Секунд</span>
        </div>
      </div>

      <div class="launched-message" id="launchedMessage">
        Welcome to Vice City.<br>GTA VI is out now!
      </div>

      <div class="date" id="dateLabel">19 ноября 2026 · 00:00 по местному времени</div>
      <div class="status">
        <i class="dot"></i>
        <span id="statusText">Ожидание запуска</span>
      </div>
    </section>

    <div class="footer">A fan-made countdown · Not affiliated with Rockstar Games</div>
  </main>
</body>
</html>
