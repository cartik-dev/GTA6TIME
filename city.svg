<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#171b49"/>
      <stop offset=".34" stop-color="#56336f"/>
      <stop offset=".68" stop-color="#e66e83"/>
      <stop offset="1" stop-color="#ffc07f"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#38516f"/>
      <stop offset=".36" stop-color="#25334f"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="glassA" x2="1" y2="1">
      <stop stop-color="#33436d"/>
      <stop offset=".5" stop-color="#20284d"/>
      <stop offset="1" stop-color="#111a37"/>
    </linearGradient>
    <linearGradient id="glassPink" x2="0" y2="1">
      <stop stop-color="#75436d"/>
      <stop offset=".45" stop-color="#352b53"/>
      <stop offset="1" stop-color="#18213d"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#34344f"/>
      <stop offset=".25" stop-color="#20253f"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <linearGradient id="carPink" x2="0" y2="1">
      <stop stop-color="#ff9ec9"/>
      <stop offset=".27" stop-color="#fb4c99"/>
      <stop offset=".72" stop-color="#a91e69"/>
      <stop offset="1" stop-color="#451b48"/>
    </linearGradient>
    <linearGradient id="carBlue" x2="0" y2="1">
      <stop stop-color="#c4fbff"/>
      <stop offset=".25" stop-color="#38c7e5"/>
      <stop offset=".7" stop-color="#16769e"/>
      <stop offset="1" stop-color="#102c52"/>
    </linearGradient>
    <linearGradient id="window" x2="0" y2="1">
      <stop stop-color="#8deeff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3d6c9b" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="headlight" x2="1" y2="0">
      <stop stop-color="#fff9ce"/>
      <stop offset="1" stop-color="#ffb96e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="windowsCool" width="34" height="38" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="12" height="20" rx="1" fill="#70dff2" opacity=".62"/>
      <rect x="23" y="7" width="5" height="20" fill="#ff8fbd" opacity=".35"/>
    </pattern>
    <pattern id="windowsWarm" width="30" height="35" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="10" height="17" rx="1" fill="#ffd18e" opacity=".7"/>
      <rect x="20" y="7" width="5" height="17" fill="#ff77b5" opacity=".5"/>
    </pattern>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

